plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// Dev debug harness (docs/DEBUGGING.md): -PrxDebug[=port] or env RX_DEBUG_PORT enables the loopback HTTP
// command server in runClient. Never set in normal play or in release jars.
def rxDebugRaw = providers.gradleProperty("rxDebug").orElse(providers.environmentVariable("RX_DEBUG_PORT")).orNull
def rxDebugPort = rxDebugRaw == null ? null : (rxDebugRaw ==~ /\d+/ ? rxDebugRaw : "25599")
// Jar comparisons keep the same dev runtime but load the selected historical mod.
def rxBenchJar = providers.gradleProperty("rxBenchJar").orNull

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			providers.gradlePropertiesPrefixedBy("reflexium.disableDh").get().each { key, value -> vmArg "-D${key}=${value}" }
			if ("true".equalsIgnoreCase(providers.gradleProperty("rxPackHdr").orNull)) vmArg "-Dreflexium.pack.hdr=true"
			vmArg "-Dreflexium.logLatency=true"
			if (rxBenchJar != null) {
				vmArg "-Xms4G"
				vmArg "-Xmx4G"
				programArg "--graphicsBackend"
				programArg "vulkan"
			}
			if (rxDebugPort != null) {
				vmArg "-Dreflexium.debugPort=${rxDebugPort}"
			}
		}
	}

	mods {
		if (rxBenchJar == null) "reflexium" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
	maven { name = "TerraformersMC"; url = "https://maven.terraformersmc.com/releases/" }
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content { includeGroup "maven.modrinth" }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	clientCompileOnly "maven.modrinth:sodium:${project.sodium_version}"
	clientCompileOnly "maven.modrinth:betterf3:${project.betterf3_version}"
	if (rxBenchJar != null) clientRuntimeOnly files(rxBenchJar)
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "loader_version", project.loader_version

	filesMatching("fabric.mod.json") {
		expand(
			"version": project.version,
			"minecraft_version": project.minecraft_version,
			"loader_version": project.loader_version
		)
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs += ["-Xlint:deprecation", "-Xlint:unchecked"]
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

sourceSets.test.compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath

tasks.register("dlssMathCheck", JavaExec) {
	dependsOn tasks.named("testClasses"), tasks.named("clientClasses")
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.bambooz.reflexium.dlss.DlssMathCheck"
}

tasks.register("objectMotionCheck", JavaExec) {
	dependsOn tasks.named("testClasses"), tasks.named("clientClasses")
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.bambooz.reflexium.dlss.ObjectMotionCheck"
}

// The assertion main above is the test runner; no JUnit dependency is needed.
tasks.named("test") { failOnNoDiscoveredTests = false }
tasks.register("upscalingContractCheck", JavaExec) {
	dependsOn tasks.named("testClasses"), tasks.named("clientClasses")
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.bambooz.reflexium.dlss.UpscalingContractCheck"
}
tasks.named("check") { dependsOn "dlssMathCheck", "objectMotionCheck", "upscalingContractCheck" }

tasks.register("frameProfilerCheck", JavaExec) {
	dependsOn tasks.named("testClasses"), tasks.named("clientClasses")
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.bambooz.reflexium.debug.FrameProfilerCheck"
}
tasks.named("check") { dependsOn "frameProfilerCheck" }

tasks.register("reflexTimingCheck", JavaExec) {
	dependsOn tasks.named("testClasses"), tasks.named("clientClasses")
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.bambooz.reflexium.reflex.ReflexTimingCheck"
}
tasks.named("check") { dependsOn "reflexTimingCheck" }

tasks.register("frameDeliveryCheck", JavaExec) {
	dependsOn tasks.named("testClasses"), tasks.named("clientClasses")
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.bambooz.reflexium.dlss.FrameDeliveryCheck"
}
tasks.named("check") { dependsOn "frameDeliveryCheck" }

tasks.register("irisCompatCheck", JavaExec) {
	dependsOn tasks.named("testClasses"), tasks.named("clientClasses")
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.bambooz.reflexium.compat.IrisCompatCheck"
	workingDir = projectDir
}
tasks.named("check") { dependsOn "irisCompatCheck" }

tasks.register("distantHorizonsCheck", JavaExec) {
	dependsOn tasks.named("testClasses"), tasks.named("clientClasses")
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "com.bambooz.reflexium.compat.DistantHorizonsCheck"
	workingDir = projectDir
}
tasks.named("check") { dependsOn "distantHorizonsCheck" }

// -PrxBenchJar: the run classpath otherwise still lists this tree's build/classes and build/resources
// ahead of the selected jar, so an "old" jar would silently execute the working tree's client code.
// Loom writes the classpath argfile from its own argument providers while the task starts, so the
// filter is the last provider and edits the file after Loom has written it.
if (rxBenchJar != null) {
	gradle.projectsEvaluated {
		tasks.named("runClient") {
			def argFile = layout.buildDirectory.file("loom-cache/argFiles/runClient").get().asFile
			def own = ["classes/java/main", "classes/java/client", "resources/main", "resources/client"]
					.collect { layout.buildDirectory.dir(it).get().asFile.absolutePath }.toSet()
			argumentProviders.add({
				def lines = argFile.readLines()
				def at = lines.indexOf("-classpath")
				def all = lines[at + 1].split(";") as List
				def kept = all.findAll { !(it in own) }
				if (kept.size() == all.size()) throw new GradleException("rxBenchJar: project outputs missing from the run classpath")
				lines[at + 1] = kept.join(";")
				argFile.text = lines.join(System.lineSeparator()) + System.lineSeparator()
				return []
			} as CommandLineArgumentProvider)
		}
	}
}

// Independent capture control, so the same Benchmark Mod driver also works with old jars.
tasks.register("bmDriverJar", Jar) {
	dependsOn tasks.named("testClasses")
	archiveFileName = "reflexium-bm-driver.jar"
	from(sourceSets.test.output) { include "com/bambooz/reflexium/debug/BmDriver*.class" }
	def metadata = layout.buildDirectory.file("bm-driver/fabric.mod.json")
	doFirst {
		metadata.get().asFile.parentFile.mkdirs()
		metadata.get().asFile.text = '{"schemaVersion":1,"id":"reflexium_bm_driver","version":"1","environment":"client","entrypoints":{"client":["com.bambooz.reflexium.debug.BmDriver"]},"depends":{"benchmarkmod":"*","agentharness":"*"}}'
	}
	from(metadata)
}

// Reflexium-<mod_version>-fabric-<minecraft_version>.jar
def releaseVersion = "${project.version}-fabric-${project.minecraft_version}"
tasks.named("jar") { archiveVersion = releaseVersion }
tasks.named("sourcesJar") { archiveVersion = releaseVersion }

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// Every build drops the jar into the local Modrinth test profile and removes older copies.
def installTarget = providers.gradleProperty("reflexiumInstallDir")
	.map { file(it) }
	.orElse(providers.environmentVariable("APPDATA").map { file("${it}/ModrinthApp/profiles/26.3 Testing Instance/mods") })

tasks.register("installReflexium", Copy) {
	group = "build"
	description = "Copies the latest Reflexium jar into the local Modrinth test profile."
	dependsOn tasks.named("jar"), tasks.named("check")
	onlyIf { installTarget.get().exists() }

	from(tasks.named("jar").flatMap { it.archiveFile })
	into(installTarget)

	doFirst {
		delete fileTree(installTarget.get()) {
			include "Reflexium-*.jar", "nvidia-reflex-mod-*.jar"
		}
	}
}

tasks.named("build") {
	dependsOn tasks.named("installReflexium")
}
